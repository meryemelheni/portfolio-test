services:
  portfolio:
    image: ${IMAGE:-portfolio-nextjs:latest}
    container_name: portfolio
    ports:
      - "${HOST_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
