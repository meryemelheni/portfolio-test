name: CI/CD Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-nextjs
  VERSION: v${{ github.run_number }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy local
        shell: powershell
        run: |
          $env:IMAGE = "${{ env.IMAGE_NAME }}:${{ env.VERSION }}"
          docker compose pull
          docker compose up -d --remove-orphans
      - name: Health check
        shell: powershell
        run: |
          for ($i = 1; $i -le 20; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri http://localhost:3000/api/health -TimeoutSec 3
              if ($r.StatusCode -eq 200) { Write-Host "Application OK : http://localhost:3000"; exit 0 }
            } catch { }
            Start-Sleep -Seconds 3
          }
          Write-Host "Health check echoue"
          docker compose logs
          exit 1
